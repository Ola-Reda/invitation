<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahmoud & Hoda - Katb Ketab Invitation</title>
    <link rel="shortcut icon" href="image.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="stage">
      <!--screen 1 -->
      <div id="screen-envelope">
        <div class="prompt-text">CLICK THE SEAL TO OPEN</div>
        <div class="envelope-wrap" id="envelopeWrap">
          <div class="card-peek"></div>
          <div class="env-body"></div>
          <div class="env-shadow-inner"></div>
          <div class="env-flap">
            <svg
              viewBox="0 0 300 120"
              preserveAspectRatio="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <defs>
                <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#fbf4e6" />
                  <stop offset="100%" stop-color="#e6d7b8" />
                </linearGradient>
              </defs>
              <path
                d="M0,0 L300,0
                   C288,14 296,26 278,30
                   C260,34 266,46 248,50
                   C230,54 234,66 214,70
                   C198,73 202,84 182,88
                   L150,112 L118,88
                   C98,84 102,73 86,70
                   C66,66 70,54 52,50
                   C34,46 40,34 22,30
                   C4,26 12,14 0,0 Z"
                fill="url(#flapGrad)"
                stroke="#cdbb95"
                stroke-width="1"
              />
            </svg>
          </div>
          <img src="images/stamp.png" class="seal" alt="stamps" />
        </div>
      </div>
      <!--screen 1 -->
      <!--screen 2 -->
      <div id="screen-names">
        <div class="names-inner">
          <img class="names-photo-bg" src="images/envolpe.png" alt="" />
          <div class="date">SAVE THE<br> DATE</div>
          <div class="names-big">
            Hoda
            <span class="amp">&</span>
            Mahmoud
            <div>
              <img src="images/letters.png" alt="letters" width="65px">
            </div>
          </div>
        </div>
      </div>
      <!--screen 2 -->
      <!--screen 3 -->
      <div id="screen-invite">
        <div class="invite-frame">
          <div class="invite-eyebrow">
            وَجَعَلَ بَيْنَكُمْ مَوَدَّةً وَرَحْمَةً ۚ
          </div>
          <div class="invite-names">
            مَحْمُود
            <span class="amp2"
              ><img src="images/small-flower.png" width="45px"
            /></span>
            هُدَى
          </div>
          <div class="invite-body">أَفْرَاحُنَا تَزْدَانُ بِحُضُورِكُمْ</div>
        </div>
      </div>
      <!--screen 3 -->
    </div>
    <script src="script.js"></script>
  </body>
</html>
