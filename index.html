<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>
<link rel="shortcut icon" href="image.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-deep:#3d0f18;
    --wine:#5c1a26;
    --wine-light:#7a2c3a;
    --cream:#f4ead9;
    --gold:#c6a15b;
    --gold-soft:#d9bd85;
    --rose:#a85a68;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--wine-deep);
    font-family:'Tajawal', sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .bg-florals{
    position:absolute;
    inset:0;
    z-index:0;
    opacity:0.35;
  }

  #screen-envelope{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:5;
    transition:opacity 1s ease, visibility 1s;
  }
  .prompt-text{
    position:absolute;
    top:16%;
    left:50%;
    transform:translateX(-50%);
    color:var(--gold-soft);
    font-family:'Aref Ruqaa', serif;
    font-size:1.4rem;
    letter-spacing:2px;
    text-align:center;
    opacity:0.9;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:0.55; transform:translateX(-50%) translateY(0);}
    50%{opacity:1; transform:translateX(-50%) translateY(-4px);}
  }

  .envelope-wrap{
    position:relative;
    width:300px;
    height:210px;
    cursor:pointer;
    perspective:1200px;
  }
  .env-body{
    position:absolute;
    inset:0;
    background:linear-gradient(155deg,#f7efdf,#e9dcc0);
    border-radius:4px;
    box-shadow:0 25px 60px rgba(0,0,0,0.55);
    overflow:hidden;
  }
  .env-body::before{
    content:'';
    position:absolute;
    inset:8px;
    border:1px solid rgba(92,26,38,0.25);
    border-radius:2px;
    pointer-events:none;
  }
  .env-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:105px;
    background:linear-gradient(160deg,#fbf4e6,#e6d7b8);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transition:transform 1.1s cubic-bezier(.6,.05,.25,1);
    z-index:3;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  .env-flap::after{
    content:'';
    position:absolute;
    inset:0;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    border-bottom:1px solid rgba(92,26,38,0.2);
  }
  .env-shadow-inner{
    position:absolute;
    top:0; left:0; right:0; height:105px;
    background:linear-gradient(180deg, rgba(61,15,24,0.15), transparent);
    z-index:1;
  }
  .seal{
    position:absolute;
    top:78px;
    left:50%;
    transform:translateX(-50%);
    width:56px; height:56px;
    z-index:4;
    transition:transform .6s ease, opacity .5s ease;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }
  .envelope-wrap.open .env-flap{
    transform:rotateX(180deg);
  }
  .envelope-wrap.open .seal{
    opacity:0;
    transform:translateX(-50%) scale(0.4) rotate(25deg);
  }
  .envelope-wrap.open{
    pointer-events:none;
  }
  .card-peek{
    position:absolute;
    left:12px; right:12px;
    bottom:10px;
    height:0;
    background:var(--cream);
    border-radius:2px;
    z-index:2;
    transition:height 1s ease .3s, bottom 1s ease .3s;
  }
  .envelope-wrap.open .card-peek{
    height:190px;
    bottom:220px;
  }

  #screen-envelope.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  #screen-names{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:4;
    opacity:0;
    visibility:hidden;
    transition:opacity 1.2s ease;
    background:radial-gradient(circle at 50% 40%, var(--wine-light), var(--wine-deep) 75%);
  }
  #screen-names.show{
    opacity:1;
    visibility:visible;
  }
  .names-inner{
    text-align:center;
    color:var(--cream);
  }
  .save-date{
    font-family:'Aref Ruqaa', serif;
    font-size:1rem;
    letter-spacing:6px;
    color:var(--gold);
    margin-bottom:22px;
    opacity:0;
    animation:fadeUp 1s ease .3s forwards;
  }
  .names-big{
    font-family:'Aref Ruqaa', serif;
    font-size:3.4rem;
    line-height:1.5;
    opacity:0;
    animation:fadeUp 1.1s ease .7s forwards;
  }
  .amp{
    display:block;
    font-size:1.6rem;
    color:var(--gold);
    margin:6px 0;
    opacity:0;
    animation:fadeUp 1.1s ease .95s forwards;
  }
  .names-sub{
    margin-top:26px;
    font-size:0.95rem;
    color:var(--gold-soft);
    letter-spacing:1px;
    opacity:0;
    animation:fadeUp 1s ease 1.3s forwards;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(18px);}
    to{opacity:1; transform:translateY(0);}
  }
  .tap-hint{
    margin-top:40px;
    font-size:0.8rem;
    color:rgba(244,234,217,0.55);
    opacity:0;
    animation:fadeUp 1s ease 2s forwards;
  }

  #screen-invite{
    position:absolute; inset:0;
    overflow-y:auto;
    z-index:3;
    opacity:0;
    visibility:hidden;
    transition:opacity 1.2s ease;
    background:
      radial-gradient(circle at 15% 10%, rgba(198,161,91,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(198,161,91,0.10), transparent 40%),
      var(--wine-deep);
  }
  #screen-invite.show{
    opacity:1;
    visibility:visible;
  }
  .invite-frame{
    max-width:480px;
    margin:0 auto;
    padding:56px 28px 70px;
    text-align:center;
    color:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .ornament-top{
    width:70px;
    margin-bottom:22px;
    opacity:0.85;
  }
  .invite-eyebrow{
    font-family:'Aref Ruqaa', serif;
    font-size:1.05rem;
    color:var(--gold-soft);
    line-height:2;
    margin-bottom:26px;
  }
  .invite-names{
    font-family:'Aref Ruqaa', serif;
    font-size:2.5rem;
    line-height:1.7;
    margin-bottom:8px;
  }
  .invite-names .amp2{
    display:block;
    color:var(--gold);
    font-size:1.3rem;
    margin:2px 0;
  }
  .divider{
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:28px auto;
  }
  .invite-body{
    font-size:1rem;
    line-height:2.1;
    color:var(--cream);
    margin-bottom:8px;
  }
  .detail-card{
    margin-top:30px;
    width:100%;
    background:rgba(244,234,217,0.06);
    border:1px solid rgba(198,161,91,0.35);
    border-radius:14px;
    padding:26px 20px;
  }
  .detail-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
    font-size:1rem;
    color:var(--cream);
  }
  .detail-row:last-child{margin-bottom:0;}
  .detail-icon{
    width:22px; height:22px;
    flex-shrink:0;
    color:var(--gold);
  }
  .detail-label{
    color:var(--gold-soft);
    font-size:0.78rem;
    display:block;
    margin-bottom:2px;
    letter-spacing:0.5px;
  }
  .detail-value{
    font-size:1.05rem;
    font-weight:500;
  }
  .closing-line{
    margin-top:34px;
    font-family:'Aref Ruqaa', serif;
    font-size:1.15rem;
    color:var(--gold-soft);
  }
  .ornament-bottom{
    width:70px;
    margin-top:34px;
    opacity:0.85;
    transform:rotate(180deg);
  }
</style>
</head>
<body>

<div class="stage">

  <svg class="bg-florals" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="fg" cx="50%" cy="50%" r="60%">
        <stop offset="0%" stop-color="#c6a15b" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="#c6a15b" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g stroke="#c6a15b" stroke-width="1" fill="none" opacity="0.5">
      <path d="M20,60 C40,30 70,30 80,60 C90,90 60,110 40,90 C20,70 40,50 60,55"/>
      <path d="M360,120 C380,90 350,60 330,90 C315,115 340,140 355,120"/>
      <path d="M30,700 C50,670 80,670 90,700 C100,730 70,750 50,730 C30,710 50,690 70,695"/>
      <path d="M340,740 C365,715 340,685 320,710 C305,730 325,755 340,740"/>
      <circle cx="55" cy="65" r="4" fill="#c6a15b" opacity="0.4"/>
      <circle cx="345" cy="105" r="4" fill="#c6a15b" opacity="0.4"/>
      <circle cx="60" cy="705" r="4" fill="#c6a15b" opacity="0.4"/>
      <circle cx="330" cy="730" r="4" fill="#c6a15b" opacity="0.4"/>
    </g>
    <circle cx="60" cy="70" r="90" fill="url(#fg)"/>
    <circle cx="350" cy="730" r="100" fill="url(#fg)"/>
  </svg>

  <div id="screen-envelope">
    <div class="prompt-text">اضغطي على الختم لفتح الدعوة</div>
    <div class="envelope-wrap" id="envelopeWrap">
      <div class="card-peek"></div>
      <div class="env-body"></div>
      <div class="env-shadow-inner"></div>
      <div class="env-flap"></div>
      <svg class="seal" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="27" fill="#5c1a26"/>
        <circle cx="30" cy="30" r="27" fill="none" stroke="#3d0f18" stroke-width="1.5"/>
        <path d="M30 14 L33 24 L44 24 L35 30 L38 41 L30 34 L22 41 L25 30 L16 24 L27 24 Z"
              fill="#c6a15b" opacity="0.9"/>
      </svg>
    </div>
  </div>

  <div id="screen-names">
    <div class="names-inner">
      <div class="save-date">دعوة كتب كتاب</div>
      <div class="names-big">
        هدى
        <span class="amp">و</span>
        محمود
      </div>
      <div class="names-sub">بإذن الله</div>
      <div class="tap-hint" id="tapHint">اضغطي في أي مكان للمتابعة</div>
    </div>
  </div>

  <div id="screen-invite">
    <div class="invite-frame">
      <svg class="ornament-top" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M5,20 Q30,0 50,20 Q70,0 95,20" stroke="#c6a15b" stroke-width="1.5" fill="none"/>
        <circle cx="50" cy="20" r="3" fill="#c6a15b"/>
      </svg>

      <div class="invite-eyebrow">
        في ليلة يتكللها الفرح والسرور<br>
        نتشرف بدعوتكم لحضور حفل كتب كتاب
      </div>

      <div class="invite-names">
        هدى
        <span class="amp2">و</span>
        محمود
      </div>

      <div class="divider"></div>

      <div class="invite-body">
        وبحضوركم يتم لنا الفرح والسرور
      </div>

      <div class="detail-card">
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <path d="M3 10h18M8 3v4M16 3v4"/>
          </svg>
          <div>
            <span class="detail-label">التاريخ</span>
            <span class="detail-value">31 يوليو</span>
          </div>
        </div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 3"/>
          </svg>
          <div>
            <span class="detail-label">الساعة</span>
            <span class="detail-value">4:00 مساءً</span>
          </div>
        </div>
        <div class="detail-row">
          <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/>
            <circle cx="12" cy="9.5" r="2.3"/>
          </svg>
          <div>
            <span class="detail-label">المكان</span>
            <span class="detail-value">مسجد الإيمان</span>
          </div>
        </div>
      </div>

      <div class="closing-line">حضوركم يسعدنا ويكمل فرحتنا</div>

      <svg class="ornament-bottom" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
        <path d="M5,20 Q30,0 50,20 Q70,0 95,20" stroke="#c6a15b" stroke-width="1.5" fill="none"/>
        <circle cx="50" cy="20" r="3" fill="#c6a15b"/>
      </svg>
    </div>
  </div>

</div>

<script>
  const envWrap = document.getElementById('envelopeWrap');
  const screenEnvelope = document.getElementById('screen-envelope');
  const screenNames = document.getElementById('screen-names');
  const screenInvite = document.getElementById('screen-invite');

  envWrap.addEventListener('click', () => {
    envWrap.classList.add('open');
    setTimeout(() => {
      screenEnvelope.classList.add('hide');
      screenNames.classList.add('show');
    }, 1300);
  });

  screenNames.addEventListener('click', () => {
    screenNames.classList.remove('show');
    screenInvite.classList.add('show');
  });
</script>

</body>
</html>
